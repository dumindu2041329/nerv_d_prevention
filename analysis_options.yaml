analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Lints that would have auto-caught several of the reviewed defects
    # (post-await BuildContext use, undisposed subscriptions/sinks). Chosen
    # for high signal and low false-positive noise — `discarded_futures` /
    # `unawaited_futures` were intentionally left out because legitimate
    # fire-and-forget `showDialog`/`Navigator` UI calls flood them.
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - unnecessary_lambdas
    - avoid_print
