# Must match SUPABASE_URL in .env (https://<project_id>.supabase.co)
project_id = "muoaodsgpgbtbdhrmnfj"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The app authenticates with Supabase Auth (email/password) — see
# lib/data/repositories/auth_repository_impl.dart. Clerk was removed.

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

[functions]
# Per-function settings live under [functions.<name>] below.
# (The old `verify_jwt = false` at this top level is rejected by Supabase CLI 2.x
# which expects a map. See https://supabase.com/docs/guides/functions/local-development)

[functions.alert-aggregator]
verify_jwt = false
# Called by Supabase Cron with the service role key, not by clients.

[functions.crisis-pins]
verify_jwt = true
# Client always invokes through supabase.functions.invoke, which attaches the
# session/anon JWT — so no unauthenticated writes to crisis_pins.

[functions.tiles]
verify_jwt = false
# flutter_map's TileLayer fetches plain images and cannot send an
# Authorization header. Keys stay server-side via Supabase Secrets.

[functions.weather]
verify_jwt = true
# Proxies the WeatherAPI.com key. The Flutter client always invokes it through
# supabase.functions.invoke, which attaches the session/anon JWT — so enabling
# verification blocks keyless callers from burning provider quota.

[functions.geocode]
verify_jwt = true
# Proxies the MapTiler geocoding key. Same client invoke path as `weather`.

[analytics]
enabled = false
# Privacy-first — no analytics tracking.